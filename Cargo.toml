[package]
name = "ffmpreg"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Video encode/decode/transcode CLI in Rust via FFmpeg"
repository = "https://github.com/JohannaWeb/FF-MPREG"

[dependencies]
ffmpeg-next = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
image = "0.25"
rayon = "1"
glob = "0.3"
